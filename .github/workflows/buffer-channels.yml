name: Buffer - check connection

# Run this from the Actions tab to confirm the BUFFER_ACCESS_TOKEN secret works
# and to see the ids of every channel connected in Buffer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/buffer.mjs channels
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
